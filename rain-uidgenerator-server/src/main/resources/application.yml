server:
  http2:
    enabled: true
  shutdown: graceful

spring:
  application:
    name: rain-uidgenerator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${RAIN_DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${RAIN_DATASOURCE_MIN_IDLE:4}
      connection-timeout: ${RAIN_DATASOURCE_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${RAIN_DATASOURCE_VALIDATION_TIMEOUT_MS:1000}
      idle-timeout: ${RAIN_DATASOURCE_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${RAIN_DATASOURCE_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${RAIN_DATASOURCE_LEAK_DETECTION_MS:30000}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.github.mxsm.rain.uid.entity

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

mxsm:
  uid:
    security:
      enabled: ${RAIN_UID_SECURITY_ENABLED:false}
      tokens: ${RAIN_UID_TOKENS:}
    segment:
      threshold: ${RAIN_UID_SEGMENT_THRESHOLD:40}
      cache-size: ${RAIN_UID_SEGMENT_CACHE_SIZE:16}
      prefetch-threads: ${RAIN_UID_SEGMENT_PREFETCH_THREADS:4}
    snowflake:
      timestamp-bits: ${RAIN_UID_SNOWFLAKE_TIMESTAMP_BITS:41}
      machine-id-bits: ${RAIN_UID_SNOWFLAKE_MACHINE_ID_BITS:10}
      sequence-bits: ${RAIN_UID_SNOWFLAKE_SEQUENCE_BITS:12}
      container: ${RAIN_UID_SNOWFLAKE_CONTAINER:false}
      time-bits-second: ${RAIN_UID_SNOWFLAKE_TIME_BITS_SECOND:false}
      epoch: ${RAIN_UID_SNOWFLAKE_EPOCH:2022-05-01}
      machine-id: ${RAIN_UID_SNOWFLAKE_MACHINE_ID:}
      pod-name: ${HOSTNAME:}
      max-backward-millis: ${RAIN_UID_SNOWFLAKE_MAX_BACKWARD_MILLIS:1000}

logging:
  level:
    com.github.mxsm.rain.uid.dao: info
