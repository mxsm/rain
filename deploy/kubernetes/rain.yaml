apiVersion: v1
kind: Namespace
metadata:
  name: rain
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rain-uidgenerator-config
  namespace: rain
data:
  SPRING_PROFILES_ACTIVE: "prod"
  RAIN_DATASOURCE_URL: "jdbc:mysql://mysql-writer.uidgenerator.svc.cluster.local:3306/uidgenerator?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=UTC"
  RAIN_DATASOURCE_USERNAME: "rain"
  RAIN_UID_SECURITY_ENABLED: "true"
  RAIN_UID_SNOWFLAKE_CONTAINER: "true"
  RAIN_UID_SEGMENT_CACHE_SIZE: "32"
  RAIN_UID_SEGMENT_PREFETCH_THREADS: "4"
---
apiVersion: v1
kind: Secret
metadata:
  name: rain-uidgenerator-secret
  namespace: rain
type: Opaque
stringData:
  RAIN_DATASOURCE_PASSWORD: "change-me"
  RAIN_UID_TOKENS: "change-me"
---
apiVersion: v1
kind: Service
metadata:
  name: rain-uidgenerator
  namespace: rain
  labels:
    app: rain-uidgenerator
spec:
  clusterIP: None
  selector:
    app: rain-uidgenerator
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rain-uidgenerator
  namespace: rain
spec:
  serviceName: rain-uidgenerator
  replicas: 3
  selector:
    matchLabels:
      app: rain-uidgenerator
  template:
    metadata:
      labels:
        app: rain-uidgenerator
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: rain-uidgenerator
          image: ghcr.io/mxsm/rain:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rain-uidgenerator-config
            - secretRef:
                name: rain-uidgenerator-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["sh","-c","sleep 10"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rain-uidgenerator
  namespace: rain
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: rain-uidgenerator
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rain-uidgenerator
  namespace: rain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: rain-uidgenerator
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rain-uidgenerator
  namespace: rain
spec:
  podSelector:
    matchLabels:
      app: rain-uidgenerator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3306
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
